name: Unzip projet

on: workflow_dispatch

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Déballer le zip
        run: |
          unzip -o nha-digital-cloud.zip -x "nha-digital-cloud/.github/*"
          cp -r nha-digital-cloud/. .
          rm -rf nha-digital-cloud nha-digital-cloud.zip
      - name: Enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Projet déballé"
          git push
